<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Contactá al equipo de RugbyBoard Pro. Soporte, feedback y consultas."/>
  <meta property="og:title" content="Contacto | RugbyBoard Pro"/>
  <meta property="og:description" content="Contactá al equipo de RugbyBoard Pro. Soporte, feedback y consultas."/>
  <meta property="og:image" content="https://rugbyboardpro.com/rbp_Italic.png"/>
  <meta property="og:url" content="https://rugbyboardpro.com/contacto.html"/>
  <meta property="og:type" content="website"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <link rel="canonical" href="https://rugbyboardpro.com/contacto.html"/>
  <link rel="preload" href="rbp_Italic.png" as="image" fetchpriority="high"/>
  <title>Contacto | RugbyBoard Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet"/>
  <style>
    :root{--fluor:#c8ff00;--fluor-dim:rgba(200,255,0,0.12);--fluor-glow:rgba(200,255,0,0.35);--black:#010409;--ink:#f0f6fc;--ink-muted:rgba(240,246,252,0.65);--border:rgba(255,255,255,0.07);--card-bg:rgba(255,255,255,0.025);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;width:100%;}
    body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--black);color:var(--ink);overflow-x:hidden;line-height:1.6;}
    .bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(200,255,0,0.07) 0%,transparent 60%);pointer-events:none;z-index:0;}
    .grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(200,255,0,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(200,255,0,0.02) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0;}
    .content-wrapper{position:relative;z-index:1;}
.lang-btn:hover,.chev{opacity:0.5;font-size:12px;}
/* CONTACT PAGE */
    .page{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:5rem 3rem;}
    .page-inner{width:100%;max-width:1200px;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;}
    .left-col{display:flex;flex-direction:column;gap:2rem;}
    .badge{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1rem;background:var(--fluor-dim);border:1px solid var(--fluor);border-radius:999px;color:var(--fluor);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;width:fit-content;}
    .badge-dot{width:7px;height:7px;background:var(--fluor);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
    .left-col h1{font-size:3.2rem;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05;letter-spacing:-.02em;}
    .left-col h1 .fluor{color:var(--fluor);}
    .left-col p{color:var(--ink-muted);font-size:1.05rem;line-height:1.8;}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
    .stat-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:1.25rem;text-align:center;}
    .stat-box .n{font-size:1.8rem;font-weight:900;font-style:italic;color:var(--fluor);text-shadow:0 0 16px var(--fluor-glow);}
    .stat-box .l{font-size:.78rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:.25rem;}

    /* FORM */
    .form-card{background:rgba(10,16,30,0.95);border:1px solid rgba(200,255,0,0.2);border-radius:24px;padding:2.5rem;box-shadow:0 0 60px rgba(200,255,0,0.06);}
    .form-card h2{font-size:1.6rem;font-weight:900;font-style:italic;text-transform:uppercase;color:var(--fluor);margin-bottom:.3rem;}
    .form-card p{color:var(--ink-muted);font-size:.9rem;margin-bottom:2rem;}
    .field{position:relative;margin-bottom:1.25rem;}
    .field input,.field textarea,.field select{
      width:100%;padding:1rem 1rem 1rem 2.8rem;
      background:rgba(255,255,255,0.04);border:1px solid var(--border);
      border-radius:12px;color:var(--ink);font-family:'Montserrat',sans-serif;
      font-size:.92rem;font-weight:500;outline:none;
      transition:border-color .2s,box-shadow .2s;
    }
    .field textarea{resize:vertical;min-height:110px;padding-left:2.8rem;}
    .field select option{background:#0a1020;}
    .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fluor);box-shadow:0 0 0 3px rgba(200,255,0,0.15);}
    .field .ico{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-muted);font-size:.85rem;pointer-events:none;}
    .field.txt-area .ico{top:1rem;transform:none;}
    .field label{display:block;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--fluor);margin-bottom:.4rem;}
    .submit-btn{width:100%;padding:1.1rem;background:var(--fluor);color:#000;border:none;border-radius:14px;font-weight:900;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:all .25s;box-shadow:0 0 30px var(--fluor-glow);font-family:'Montserrat',sans-serif;}
    .submit-btn:hover{box-shadow:0 0 50px var(--fluor-glow);transform:translateY(-2px);}
    .secure-note{text-align:center;font-size:.8rem;color:var(--ink-muted);margin-top:1rem;}
    .toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;border-radius:14px;font-weight:700;z-index:9999;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.success{background:rgba(200,255,0,0.15);border:1px solid var(--fluor);color:var(--fluor);}
    .toast.error{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444;}

    /* WhatsApp */
    .whatsapp-float{position:fixed;bottom:2rem;left:2rem;z-index:1000;width:56px;height:56px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;box-shadow:0 8px 24px rgba(37,211,102,0.4);transition:transform .2s,box-shadow .2s;}
    .whatsapp-float:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 32px rgba(37,211,102,0.5);}

.@media(max-width:768px){.page{padding:3rem 1.25rem;}.page-inner{grid-template-columns:1fr;gap:2.5rem;}.left-col h1{font-size:2rem;}.stats-row{grid-template-columns:1fr 1fr 1fr;gap:.75rem;}.}
    @view-transition{navigation:auto;}
  
    /* Sticky nav scroll offset */
    [id] { scroll-margin-top: 82px; }

    @media (max-width: 860px) {
      .page { padding: 3rem 1.5rem; }
      .page-inner { grid-template-columns: 1fr !important; gap: 2rem; }
      .left-col h1 { font-size: 2rem; }
      .stats-row { gap: .5rem; }
    }
    @media (max-width: 480px) {
      .page { padding: 2rem 1rem; }
      .left-col h1 { font-size: 1.7rem; }
    }</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-overlay"></div>
  <div class="content-wrapper">

    <!-- RBP_NAV -->


    <main class="page">
      <div class="page-inner">
        <div class="left-col">
          <div class="badge"><span class="badge-dot"></span><span data-i18n="tag">🏉 Contacto</span></div>
          <h1><span data-i18n="title">Llevá tu equipo al</span> <span class="fluor" data-i18n="titleFluor">próximo nivel</span></h1>
          <p data-i18n="subtitle">Hablemos de cómo potenciar tu club con tecnología de vanguardia</p>
          <div class="stats-row">
            <div class="stat-box"><div class="n">500+</div><div class="l" data-i18n="stat1">Equipos</div></div>
            <div class="stat-box"><div class="n">98%</div><div class="l" data-i18n="stat2">Satisfacción</div></div>
            <div class="stat-box"><div class="n">24/7</div><div class="l" data-i18n="stat3">Soporte</div></div>
          </div>
        </div>

        <div class="form-card">
          <h2 data-i18n="formTitle">Comenzá ahora</h2>
          <p data-i18n="formSub">Completá el formulario y nos contactamos en 24hs</p>
          <form id="contact-form" action="https://formspree.io/f/xldlvjgn" method="POST">
            <div class="field">
              <label data-i18n="lbl1">Nombre completo</label>
              <i class="fas fa-user ico"></i>
              <input type="text" name="nombre" placeholder="Tu nombre" required/>
            </div>
            <div class="field">
              <label data-i18n="lbl2">Email</label>
              <i class="fas fa-envelope ico"></i>
              <input type="email" name="email" placeholder="tu@email.com" required/>
            </div>
            <div class="field">
              <label data-i18n="lbl3">Teléfono</label>
              <i class="fas fa-phone ico"></i>
              <input type="tel" name="telefono" placeholder="+54 351..."/>
            </div>
            <div class="field">
              <label data-i18n="lbl4">Tamaño del club</label>
              <i class="fas fa-users ico"></i>
              <select name="club_size" required>
                <option value="" disabled selected></option>
                <option value="1-50">1–50 jugadores</option>
                <option value="51-100">51–100</option>
                <option value="101-200">101–200</option>
                <option value="200+">200+</option>
              </select>
            </div>
            <div class="field txt-area">
              <label data-i18n="lbl5">Mensaje</label>
              <i class="fas fa-comment ico"></i>
              <textarea name="mensaje" placeholder="Contanos sobre tu club..." required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">
              <span id="btn-text" data-i18n="btnSend">Enviar mensaje</span>
            </button>
            <p class="secure-note" data-i18n="secure">🔒 Tus datos están protegidos y seguros</p>
          </form>
        </div>
      </div>
    </main>
    <!-- RBP_FOOTER -->

  </div>

  <a href="https://wa.me/5493516613053" class="whatsapp-float" target="_blank">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.792.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
  </a>
  <div id="toast" class="toast"></div>

  
<script>
const toast=document.getElementById("toast");
function showToast(msg,type){toast.textContent=msg;toast.className="toast "+type+" show";setTimeout(()=>toast.classList.remove("show"),4000);}
document.getElementById("contact-form")?.addEventListener("submit",async function(e){
  e.preventDefault();
  const btn=document.getElementById("submit-btn"),t=document.getElementById("btn-text");
  btn.disabled=true;t.textContent="Enviando...";
  try{
    const res=await fetch(this.action,{method:"POST",body:new FormData(this),headers:{Accept:"application/json"}});
    if(res.ok){showToast("✓ ¡Mensaje enviado! Te contactamos pronto.","success");this.reset();}
    else showToast("Error al enviar. Intentá de nuevo.","error");
  }catch{showToast("Error de conexión.","error");}
  btn.disabled=false;t.textContent="Enviar mensaje";
});
</script>
<script src="rbp-shared.js"></script>
</body>
</html>
